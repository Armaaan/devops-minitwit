server {
    listen 80;
    listen [::]:80;
    server_name mini-twit.tech www.mini-twit.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mini-twit.tech www.mini-twit.tech;

    ssl_certificate /etc/letsencrypt/live/mini-twit.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mini-twit.tech/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name grafana.mini-twit.tech;
    ssl_certificate /etc/letsencrypt/live/grafana.mini-twit.tech/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/grafana.mini-twit.tech/privkey.pem; # managed by Certbot


    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

}
