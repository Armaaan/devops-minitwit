<svg width="900" height="600" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" font-family="Arial,Helvetica,sans-serif">
  <rect width="900" height="600" fill="white"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">ITU-MiniTwit — Deployment Architecture</text>

  <!-- Internet -->
  <rect x="20" y="60" width="120" height="44" rx="8" fill="#F1EFE8" stroke="#888" stroke-width="1"/>
  <text x="80" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Internet</text>
  <text x="80" y="96" text-anchor="middle" font-size="10" fill="#666">Browser / Simulator</text>

  <!-- Arrow to Nginx -->
  <line x1="140" y1="82" x2="200" y2="82" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="170" y="76" text-anchor="middle" font-size="9" fill="#666">HTTPS</text>

  <!-- Nginx -->
  <rect x="200" y="60" width="160" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="280" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#085041">Nginx</text>
  <text x="280" y="96" text-anchor="middle" font-size="10" fill="#0F6E56">Reverse proxy + TLS</text>

  <!-- Let's Encrypt -->
  <rect x="380" y="68" width="130" height="28" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
  <text x="445" y="83" text-anchor="middle" font-size="10" fill="#27500A">Let's Encrypt cert</text>
  <line x1="360" y1="82" x2="378" y2="82" stroke="#888" stroke-width="0.8" stroke-dasharray="3 2"/>

  <!-- DigitalOcean droplet container -->
  <rect x="20" y="130" width="860" height="440" rx="16" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
  <text x="450" y="156" text-anchor="middle" font-size="12" font-weight="bold" fill="#0C447C">DigitalOcean Droplet · Ubuntu 22.04 · 2 GB RAM · Frankfurt FRA1</text>

  <!-- Docker Swarm container -->
  <rect x="40" y="170" width="820" height="390" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
  <text x="450" y="192" text-anchor="middle" font-size="11" fill="#3C3489">Docker Swarm — single-node manager</text>

  <!-- App replicas -->
  <rect x="60" y="205" width="230" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="175" y="226" text-anchor="middle" font-size="13" font-weight="bold" fill="#085041">minitwit replica 1</text>
  <text x="175" y="244" text-anchor="middle" font-size="10" fill="#0F6E56">FastAPI · Python 3.12 · port 5000</text>

  <rect x="310" y="205" width="230" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="425" y="226" text-anchor="middle" font-size="13" font-weight="bold" fill="#085041">minitwit replica 2</text>
  <text x="425" y="244" text-anchor="middle" font-size="10" fill="#0F6E56">FastAPI · Python 3.12 · port 5000</text>

  <!-- PostgreSQL -->
  <rect x="560" y="205" width="180" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.5"/>
  <text x="650" y="226" text-anchor="middle" font-size="13" font-weight="bold" fill="#633806">PostgreSQL 16</text>
  <text x="650" y="244" text-anchor="middle" font-size="10" fill="#854F0B">port 5432 · 3 tables</text>

  <!-- Monitoring row -->
  <rect x="60" y="290" width="170" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
  <text x="145" y="311" text-anchor="middle" font-size="12" font-weight="bold" fill="#712B13">Prometheus</text>
  <text x="145" y="329" text-anchor="middle" font-size="10" fill="#993C1D">metrics · port 9090</text>

  <rect x="245" y="290" width="170" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
  <text x="330" y="311" text-anchor="middle" font-size="12" font-weight="bold" fill="#712B13">Grafana</text>
  <text x="330" y="329" text-anchor="middle" font-size="10" fill="#993C1D">dashboards · port 3000</text>

  <rect x="430" y="290" width="150" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
  <text x="505" y="311" text-anchor="middle" font-size="12" font-weight="bold" fill="#712B13">Loki</text>
  <text x="505" y="329" text-anchor="middle" font-size="10" fill="#993C1D">logs · port 3100</text>

  <rect x="595" y="290" width="150" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
  <text x="670" y="311" text-anchor="middle" font-size="12" font-weight="bold" fill="#712B13">Promtail</text>
  <text x="670" y="329" text-anchor="middle" font-size="10" fill="#993C1D">log shipper</text>

  <!-- Infrastructure row -->
  <rect x="60" y="375" width="170" height="56" rx="8" fill="#F1EFE8" stroke="#888" stroke-width="1"/>
  <text x="145" y="396" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">Node Exporter</text>
  <text x="145" y="414" text-anchor="middle" font-size="10" fill="#666">host metrics · port 9100</text>

  <rect x="245" y="375" width="170" height="56" rx="8" fill="#F1EFE8" stroke="#888" stroke-width="1"/>
  <text x="330" y="396" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">Visualizer</text>
  <text x="330" y="414" text-anchor="middle" font-size="10" fill="#666">swarm view · port 8888</text>

  <!-- Nginx arrows to replicas -->
  <line x1="280" y1="104" x2="175" y2="203" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="280" y1="104" x2="370" y2="203" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- App to DB -->
  <line x1="290" y1="233" x2="558" y2="233" stroke="#854F0B" stroke-width="1" stroke-dasharray="4 2" marker-end="url(#arr)"/>
  <line x1="540" y1="233" x2="558" y2="233" stroke="#854F0B" stroke-width="1" stroke-dasharray="4 2"/>

  <!-- App to Prometheus -->
  <line x1="175" y1="261" x2="145" y2="288" stroke="#993C1D" stroke-width="1" stroke-dasharray="4 2" marker-end="url(#arr)"/>
  <text x="110" y="278" text-anchor="middle" font-size="9" fill="#993C1D">/metrics</text>

  <!-- Prometheus to Grafana -->
  <line x1="232" y1="318" x2="243" y2="318" stroke="#993C1D" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Loki to Grafana -->
  <line x1="430" y1="318" x2="417" y2="318" stroke="#993C1D" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Promtail to Loki -->
  <line x1="595" y1="318" x2="582" y2="318" stroke="#993C1D" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Node Exporter to Prometheus -->
  <line x1="145" y1="375" x2="145" y2="348" stroke="#993C1D" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#arr)"/>

  <!-- Domain labels -->
  <rect x="60" y="450" width="740" height="50" rx="8" fill="white" stroke="#ccc" stroke-width="1"/>
  <text x="80" y="470" font-size="11" fill="#333" font-weight="bold">Domains:</text>
  <text x="80" y="488" font-size="10" fill="#185FA5">mini-twit.tech → port 5000 (app)   ·   grafana.mini-twit.tech → port 3000 (Grafana)</text>

  <!-- Legend -->
  <rect x="60" y="510" width="10" height="10" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="76" y="520" font-size="10" fill="#333">App</text>
  <rect x="110" y="510" width="10" height="10" fill="#FAEEDA" stroke="#854F0B"/>
  <text x="126" y="520" font-size="10" fill="#333">Database</text>
  <rect x="190" y="510" width="10" height="10" fill="#FAECE7" stroke="#993C1D"/>
  <text x="206" y="520" font-size="10" fill="#333">Observability</text>
  <rect x="290" y="510" width="10" height="10" fill="#F1EFE8" stroke="#888"/>
  <text x="306" y="520" font-size="10" fill="#333">Infrastructure</text>
</svg>
