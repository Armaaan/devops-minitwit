<svg width="1200" height="820" viewBox="0 0 1200 820" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Component &amp; Connector Viewpoint — Runtime Communication</title>
<desc>Architecture diagram showing runtime communication between Browser, Course Simulator, Nginx reverse proxy, FastAPI replicas, PostgreSQL, Prometheus, Grafana, Promtail, Loki, and Node Exporter.</desc>
<rect width="1200" height="820" fill="white"/>
<defs>
  <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#378ADD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arr-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#3B6D11" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arr-olive" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#639922" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#A32D2D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arr-brown" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#854F0B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arr-purple2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arr-greend" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<!-- Title -->
<text x="600" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="500" fill="#2C2C2A">Component &amp; Connector Viewpoint — Runtime Communication</text>

<!-- Browser -->
<rect x="110" y="60" width="160" height="64" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="190" y="87" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#2C2C2A">Browser</text>
<text x="190" y="107" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5F5E5A">User (HTTPS)</text>

<!-- Course Simulator -->
<rect x="420" y="60" width="220" height="64" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="530" y="87" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#2C2C2A">Course Simulator</text>
<text x="530" y="107" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5F5E5A">104.248.134.203 · HTTPS + Basic Auth</text>

<!-- Nginx -->
<rect x="300" y="192" width="260" height="64" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.8"/>
<text x="430" y="219" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#085041">Nginx — Reverse Proxy</text>
<text x="430" y="239" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0F6E56">mini-twit.tech:443 · Let's Encrypt TLS</text>

