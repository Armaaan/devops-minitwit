<rect x="60" y="350" width="185" height="90" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.8"/>
<text x="152" y="373" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#085041">FastAPI Replica 1</text>
<text x="152" y="391" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#0F6E56">Web routes (HTML/Jinja2)</text>
<text x="152" y="406" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#0F6E56">Simulator API (JSON)</text>
<text x="152" y="421" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#0F6E56">/metrics endpoint</text>

<!-- FastAPI Replica 2 -->
<rect x="290" y="350" width="185" height="90" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.8"/>
<text x="382" y="373" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#085041">FastAPI Replica 2</text>
<text x="382" y="391" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#0F6E56">Web routes (HTML/Jinja2)</text>
<text x="382" y="406" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#0F6E56">Simulator API (JSON)</text>
<text x="382" y="421" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#0F6E56">/metrics endpoint</text>

<!-- PostgreSQL 16 -->
<rect x="530" y="350" width="165" height="90" rx="8" fill="#FAC775" stroke="#BA7517" stroke-width="0.8"/>
<text x="612" y="373" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#412402">PostgreSQL 16</text>
<text x="612" y="393" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#633806">user · message</text>
<text x="612" y="409" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#633806">follower tables</text>

<!-- Prometheus -->
<rect x="762" y="350" width="165" height="90" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.8"/>
<text x="844" y="373" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#4A1B0C">Prometheus</text>
<text x="844" y="393" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#712B13">metrics store</text>
<text x="844" y="409" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#712B13">port 9090</text>

<!-- Grafana -->
<rect x="990" y="350" width="165" height="90" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.8"/>
<text x="1072" y="373" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#4A1B0C">Grafana</text>
<text x="1072" y="393" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#712B13">dashboards · port 3000</text>
<text x="1072" y="409" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#712B13">Prometheus + Loki</text>

<!-- Promtail -->
<rect x="60" y="570" width="185" height="76" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.8"/>
<text x="152" y="592" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#26215C">Promtail</text>
<text x="152" y="611" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#3C3489">reads Docker json-file logs</text>
<text x="152" y="626" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#3C3489">/var/lib/docker/containers/</text>

<!-- Loki -->
<rect x="310" y="570" width="165" height="76" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.8"/>
<text x="392" y="592" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#26215C">Loki</text>
<text x="392" y="611" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#3C3489">log aggregation</text>
<text x="392" y="626" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#3C3489">port 3100</text>

<!-- Node Exporter -->
<rect x="762" y="570" width="165" height="76" rx="8" fill="#D3D1C7" stroke="#888780" stroke-width="0.8"/>
<text x="844" y="592" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#2C2C2A">Node Exporter</text>
<text x="844" y="611" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#5F5E5A">host CPU/RAM/disk</text>
<text x="844" y="626" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#5F5E5A">port 9100</text>

<!-- CONNECTORS -->

<!-- 1. Blue solid: Browser → Nginx -->
<path d="M190 124 L190 186 L300 186 L300 212" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arr-blue)"/>
<text x="225" y="181" font-family="Arial, sans-serif" font-size="10" fill="#185FA5">HTTPS GET/POST</text>

<!-- 2. Indigo solid: Course Simulator → Nginx -->
<path d="M530 124 L530 186 L562 186 L562 212" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arr-indigo)"/>
<text x="540" y="181" font-family="Arial, sans-serif" font-size="10" fill="#3C3489">HTTPS + Basic Auth</text>

<!-- 3a. Green solid: Nginx → FastAPI Replica 1 -->
<path d="M330 256 L330 310 L152 310 L152 350" fill="none" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arr-green)"/>
<text x="155" y="307" font-family="Arial, sans-serif" font-size="10" fill="#27500A">HTTP proxy · load balanced</text>

<!-- 3b. Green solid: Nginx → FastAPI Replica 2 -->
<path d="M430 256 L430 310 L382 310 L382 350" fill="none" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arr-green)"/>

<!-- 4a. Olive: FastAPI Replica 1 → PostgreSQL -->
<path d="M245 395 L530 395" fill="none" stroke="#639922" stroke-width="1.5" marker-end="url(#arr-olive)"/>
<text x="350" y="388" font-family="Arial, sans-serif" font-size="10" fill="#3B6D11">SQLAlchemy ORM · port 5432</text>

<!-- 4b. Olive: FastAPI Replica 2 → PostgreSQL -->
<path d="M475 410 L530 410" fill="none" stroke="#639922" stroke-width="1.5" marker-end="url(#arr-olive)"/>

<!-- 5. Green dotted: Nginx → Grafana -->
<path d="M560 224 L700 224 L700 280 L1072 280 L1072 350" fill="none" stroke="#1D9E75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arr-greend)"/>
<text x="780" y="276" font-family="Arial, sans-serif" font-size="10" fill="#0F6E56">grafana.mini-twit.tech</text>

<!-- 6a. Red dashed: Prometheus → FastAPI Replica 1 /metrics -->
<path d="M762 370 L680 370 L680 335 L152 335 L152 350" fill="none" stroke="#A32D2D" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arr-red)"/>
<text x="370" y="332" font-family="Arial, sans-serif" font-size="10" fill="#791F1F">scrape /metrics every 15s</text>

<!-- 6b. Red dashed: Prometheus → FastAPI Replica 2 /metrics -->
<path d="M762 380 L710 380 L710 340 L382 340 L382 350" fill="none" stroke="#A32D2D" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arr-red)"/>

<!-- 7. Red dashed: Prometheus → Node Exporter -->
<path d="M844 440 L844 570" fill="none" stroke="#A32D2D" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arr-red)"/>
