<!-- 9b. Purple dashed: FastAPI Replica 2 → Promtail -->
<path d="M382 440 L382 530 L245 530 L245 570" fill="none" stroke="#7F77DD" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arr-purple2)"/>

<!-- 10. Purple solid: Promtail → Loki -->
<path d="M245 608 L310 608" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arr-purple)"/>
<text x="260" y="602" font-family="Arial, sans-serif" font-size="10" fill="#26215C">push</text>

<!-- 11. Purple dashed: Grafana → Loki -->
<path d="M1072 440 L1072 550 L392 550 L392 570" fill="none" stroke="#7F77DD" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arr-purple2)"/>
<text x="740" y="546" font-family="Arial, sans-serif" font-size="10" fill="#3C3489">LogQL</text>

