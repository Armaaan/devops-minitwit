<svg width="800" height="460" viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" font-family="Arial,Helvetica,sans-serif">
  <rect width="800" height="460" fill="white"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
  </defs>

  <text x="400" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Module Viewpoint — Application Structure</text>

  <!-- Clients -->
  <rect x="60" y="50" width="160" height="50" rx="8" fill="#F1EFE8" stroke="#888" stroke-width="1"/>
  <text x="140" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Browser</text>
  <text x="140" y="88" text-anchor="middle" font-size="10" fill="#666">HTML requests</text>

  <rect x="560" y="50" width="180" height="50" rx="8" fill="#F1EFE8" stroke="#888" stroke-width="1"/>
  <text x="650" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Simulator</text>
  <text x="650" y="88" text-anchor="middle" font-size="10" fill="#666">JSON + Basic Auth</text>

  <!-- Arrows from clients to app -->
  <line x1="140" y1="100" x2="200" y2="140" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="650" y1="100" x2="590" y2="140" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- app.py container -->
  <rect x="60" y="140" width="680" height="165" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="2"/>
  <text x="400" y="162" text-anchor="middle" font-size="13" font-weight="bold" fill="#085041">app.py — FastAPI Application</text>

  <!-- Web routes -->
  <rect x="80" y="175" width="290" height="110" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
  <text x="225" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#0C447C">Web Routes (HTML)</text>
  <text x="225" y="214" text-anchor="middle" font-size="10" fill="#185FA5">/ — personal timeline</text>
  <text x="225" y="229" text-anchor="middle" font-size="10" fill="#185FA5">/public — public timeline</text>
  <text x="225" y="244" text-anchor="middle" font-size="10" fill="#185FA5">/login · /register · /logout</text>
  <text x="225" y="259" text-anchor="middle" font-size="10" fill="#185FA5">/add_message · /{username}</text>
  <text x="225" y="274" text-anchor="middle" font-size="10" fill="#185FA5">follow/unfollow</text>

  <!-- Simulator API -->
  <rect x="390" y="175" width="330" height="110" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
  <text x="555" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#3C3489">Simulator API (JSON)</text>
  <text x="555" y="214" text-anchor="middle" font-size="10" fill="#534AB7">GET /latest</text>
  <text x="555" y="229" text-anchor="middle" font-size="10" fill="#534AB7">POST /register</text>
  <text x="555" y="244" text-anchor="middle" font-size="10" fill="#534AB7">GET/POST /msgs · /msgs/{user}</text>
  <text x="555" y="259" text-anchor="middle" font-size="10" fill="#534AB7">GET/POST /fllws/{user}</text>
  <text x="555" y="274" text-anchor="middle" font-size="10" fill="#534AB7">Auth: Basic c2ltdWxhdG9y...</text>

  <!-- Arrow app.py → models.py -->
  <line x1="400" y1="305" x2="400" y2="335" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="450" y="324" font-size="10" fill="#666">SQLAlchemy session</text>

  <!-- models.py container -->
  <rect x="60" y="335" width="680" height="70" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="2"/>
  <text x="400" y="357" text-anchor="middle" font-size="13" font-weight="bold" fill="#633806">models.py — SQLAlchemy ORM (zero raw SQL)</text>

  <rect x="90" y="368" width="160" height="28" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
  <text x="170" y="384" text-anchor="middle" font-size="10" fill="#173404">User model</text>

  <rect x="320" y="368" width="160" height="28" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
  <text x="400" y="384" text-anchor="middle" font-size="10" fill="#173404">Message model</text>

  <rect x="550" y="368" width="160" height="28" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
  <text x="630" y="384" text-anchor="middle" font-size="10" fill="#173404">Follower model</text>

  <!-- Arrow to DB -->
  <line x1="400" y1="405" x2="400" y2="428" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Database -->
  <rect x="200" y="428" width="400" height="24" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
  <text x="400" y="443" text-anchor="middle" font-size="11" font-weight="bold" fill="#712B13">PostgreSQL 16 — user · message · follower tables</text>
</svg>
