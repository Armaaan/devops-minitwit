<svg width="900" height="520" viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial,Helvetica,sans-serif">
  <rect width="900" height="520" fill="white"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
  </defs>

  <text x="450" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">CI/CD Pipeline — GitHub Actions</text>

  <!-- git push -->
  <rect x="20" y="50" width="140" height="50" rx="8" fill="#F1EFE8" stroke="#888" stroke-width="1"/>
  <text x="90" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">git push main</text>
  <text x="90" y="88" text-anchor="middle" font-size="10" fill="#666">triggers workflows</text>

  <line x1="160" y1="75" x2="200" y2="75" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- GitHub -->
  <rect x="200" y="50" width="100" height="50" rx="8" fill="#F1EFE8" stroke="#888" stroke-width="1"/>
  <text x="250" y="79" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">GitHub</text>

  <!-- CI workflow box -->
  <rect x="20" y="130" width="460" height="290" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
  <text x="250" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#0C447C">CI Workflow</text>

  <!-- Test job -->
  <rect x="40" y="165" width="200" height="90" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="140" y="184" text-anchor="middle" font-size="11" font-weight="bold" fill="#085041">Tests (quality gate)</text>
  <text x="140" y="201" text-anchor="middle" font-size="9" fill="#0F6E56">4 integration tests</text>
  <text x="140" y="216" text-anchor="middle" font-size="9" fill="#0F6E56">9 simulator API tests</text>
  <text x="140" y="231" text-anchor="middle" font-size="9" fill="#0F6E56">3 UI end-to-end tests</text>
  <text x="140" y="246" text-anchor="middle" font-size="9" fill="#0F6E56">STOPS pipeline if fail</text>

  <!-- Lint job -->
  <rect x="260" y="165" width="200" height="90" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="360" y="184" text-anchor="middle" font-size="11" font-weight="bold" fill="#085041">Static Analysis</text>
  <text x="360" y="201" text-anchor="middle" font-size="9" fill="#0F6E56">ruff · black (Python)</text>
  <text x="360" y="216" text-anchor="middle" font-size="9" fill="#0F6E56">hadolint (Dockerfile)</text>
  <text x="360" y="231" text-anchor="middle" font-size="9" fill="#0F6E56">shellcheck (shell)</text>
  <text x="360" y="246" text-anchor="middle" font-size="9" fill="#0F6E56">Semgrep · Trivy</text>

  <!-- Arrows to Docker build -->
  <line x1="140" y1="255" x2="210" y2="285" stroke="#555" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="360" y1="255" x2="295" y2="285" stroke="#555" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Docker build -->
  <rect x="110" y="285" width="260" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
  <text x="240" y="305" text-anchor="middle" font-size="12" font-weight="bold" fill="#3C3489">Docker image build</text>
  <text x="240" y="321" text-anchor="middle" font-size="9" fill="#534AB7">requires tests + lint to pass</text>

  <!-- Fail box -->
  <rect x="40" y="355" width="160" height="36" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
  <text x="120" y="370" text-anchor="middle" font-size="10" font-weight="bold" fill="#791F1F">❌ Fail → stop</text>
  <text x="120" y="384" text-anchor="middle" font-size="9" fill="#A32D2D">no delivery</text>
  <line x1="140" y1="255" x2="120" y2="353" stroke="#E24B4A" stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#arr)"/>

  <!-- SonarCloud / Codacy -->
  <rect x="40" y="405" width="420" height="28" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="250" y="422" text-anchor="middle" font-size="10" fill="#633806">SonarCloud + Codacy — async analysis on every push</text>

  <!-- CD workflow box -->
  <rect x="510" y="130" width="370" height="290" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
  <text x="695" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#712B13">CD Workflow</text>

  <!-- CD steps -->
  <rect x="530" y="165" width="330" height="44" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="1"/>
  <text x="695" y="183" text-anchor="middle" font-size="11" font-weight="bold" fill="#4B1528">Build + push Docker image</text>
  <text x="695" y="199" text-anchor="middle" font-size="9" fill="#993556">Docker Hub :latest + :sha256</text>

  <line x1="695" y1="209" x2="695" y2="229" stroke="#555" stroke-width="1" marker-end="url(#arr)"/>

  <rect x="530" y="229" width="330" height="44" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="1"/>
  <text x="695" y="247" text-anchor="middle" font-size="11" font-weight="bold" fill="#4B1528">SSH deploy to server</text>
  <text x="695" y="263" text-anchor="middle" font-size="9" fill="#993556">docker stack deploy minitwit</text>

  <line x1="695" y1="273" x2="695" y2="293" stroke="#555" stroke-width="1" marker-end="url(#arr)"/>

  <rect x="530" y="293" width="330" height="44" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="1"/>
  <text x="695" y="311" text-anchor="middle" font-size="11" font-weight="bold" fill="#4B1528">Rolling update</text>
  <text x="695" y="327" text-anchor="middle" font-size="9" fill="#993556">start-first · parallelism:1 · zero downtime</text>

  <line x1="695" y1="337" x2="695" y2="357" stroke="#555" stroke-width="1" marker-end="url(#arr)"/>

  <rect x="530" y="357" width="330" height="44" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
  <text x="695" y="375" text-anchor="middle" font-size="11" font-weight="bold" fill="#173404">Auto GitHub release</text>
  <text x="695" y="391" text-anchor="middle" font-size="9" fill="#3B6D11">deploy-N tag created automatically</text>

  <!-- Production -->
  <rect x="530" y="415" width="330" height="28" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="695" y="433" text-anchor="middle" font-size="11" font-weight="bold" fill="#085041">mini-twit.tech (production)</text>
  <line x1="695" y1="401" x2="695" y2="413" stroke="#555" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Trigger arrow GitHub → CI and CD -->
  <line x1="250" y1="100" x2="250" y2="128" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="250" y1="100" x2="695" y2="128" stroke="#555" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arr)"/>

  <!-- Trigger arrow CI → CD -->
  <line x1="480" y1="210" x2="508" y2="210" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="494" y="204" text-anchor="middle" font-size="9" fill="#555">triggers</text>
</svg>
