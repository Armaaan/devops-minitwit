name: CD

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy to DigitalOcean
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./minitwit
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/devops-minitwit:latest

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /minitwit
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

      - name: Create GitHub release automatically (session 04)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: deploy-${{ github.run_number }}
          name: "Deployment #${{ github.run_number }}"
          body: |
            Automatic release from CD pipeline.
            Commit: ${{ github.sha }}
            Deployed to: http://${{ secrets.SSH_HOST }}:5000
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
