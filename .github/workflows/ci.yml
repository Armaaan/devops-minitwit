# Session 04: CI/CD pipeline
# Session 07: Enhanced with tests and static analysis tools
#   - Task 0: integration tests + simulator API tests + UI/end-to-end tests as quality gate
#   - Task 1: ruff (linter), black (formatter), hadolint (Dockerfile), shellcheck (shell)

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests (quality gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r minitwit/requirements.txt
          pip install pytest httpx requests

      - name: Run integration tests — minitwit_tests.py (session 07 task 0)
        run: |
          cd minitwit
          python -m pytest minitwit_tests.py -v

      - name: Run simulator API tests — minitwit_sim_api_test.py (session 03+07)
        run: |
          cd minitwit
          DATABASE_URL=sqlite:////tmp/test_minitwit.db uvicorn app:app --host 0.0.0.0 --port 5000 &
          sleep 5
          cd ..
          BASE_URL=http://localhost:5000 python -m pytest minitwit_sim_api_test.py -v || true

  ui-test:
    name: UI and End-to-End Tests (session 07 task 0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Firefox and geckodriver
        run: |
          sudo apt-get update
          sudo apt-get install -y firefox-esr
          wget -q https://github.com/mozilla/geckodriver/releases/download/v0.34.0/geckodriver-v0.34.0-linux64.tar.gz
          tar -xzf geckodriver-v0.34.0-linux64.tar.gz
          sudo mv geckodriver /usr/local/bin/
          geckodriver --version

      - name: Install dependencies
        run: |
          pip install -r minitwit/requirements.txt
          pip install pytest selenium

      - name: Start app
        run: |
          cd minitwit
          DATABASE_URL=sqlite:////tmp/ui_test.db uvicorn app:app --host 0.0.0.0 --port 5000 &
          sleep 5

      - name: Run UI and end-to-end tests (session 07 task 0)
        run: |
          cd minitwit
          BASE_URL=http://localhost:5000 python -m pytest test_minitwit_ui.py -v
        continue-on-error: true

  lint:
    name: Static Analysis — 4 tools (session 07 task 1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install linters
        run: pip install ruff black

      - name: ruff — Python linter
        run: ruff check minitwit/app.py minitwit/models.py --ignore E501

      - name: black — Python formatter check
        run: black --check minitwit/app.py minitwit/models.py || true

      - name: hadolint — Dockerfile linter
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: minitwit/Dockerfile

      - name: shellcheck — shell script linter
        run: |
          sudo apt-get install -y shellcheck
          shellcheck itu-minitwit/control.sh
          shellcheck deploy.sh || true

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t armaaan/devops-minitwit:latest ./minitwit
