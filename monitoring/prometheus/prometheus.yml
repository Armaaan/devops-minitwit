# Session 06: Prometheus configuration
# Scrapes metrics from the MiniTwit app and node exporter
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'minitwit'
    static_configs:
      - targets: ['minitwit:5000']
    metrics_path: '/metrics'

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
